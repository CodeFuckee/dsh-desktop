name: build-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # AppImage bundling via linuxdeploy is flaky on ubuntu-22.04 CI
            # runners (see README "已知限制"); deb is the reliable Linux
            # installer. Build AppImage locally where the toolchain works.
            bundles: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            # .app first (signed); the dmg is packaged in a later step after
            # the signature is verified, because the dmg bundler removes the
            # .app staging copy.
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux system dependencies (Tauri v2 + node-pty build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            python3 \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tooling
        run: npm ci

      - name: Prepare offline runtime (Node + @deepseek-ai/dsh)
        run: node scripts/prepare-runtime.mjs --target ${{ matrix.target }}

      - name: Build desktop app
        env:
          # FUSE is unavailable on CI runners: extract linuxdeploy instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Verify macOS code signature (Gatekeeper damaged-app regression)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle -maxdepth 4 \
            -name '*.app' -type d | head -1)"
          echo "verifying: ${APP}"
          test -n "${APP}"
          codesign -dv "${APP}"
          codesign --verify --deep --strict "${APP}"
          echo "codesign --verify --deep --strict: OK (adhoc signed, not 'damaged')"

      - name: Package macOS dmg from the signed app
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg

      - name: Smoke-test the packaged runtime (process-level acceptance)
        run: node scripts/smoke-test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: src-tauri/target/release/bundle/**

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Only installer artifacts — a broad `bundle/**/*` glob picks up
          # bundler staging debris (node_modules trees etc.).
          files: |
            src-tauri/target/release/bundle/*/*.dmg
            src-tauri/target/release/bundle/*/*.deb
            src-tauri/target/release/bundle/*/*.exe
            src-tauri/target/release/bundle/*/*.msi
            src-tauri/target/release/bundle/*/*.AppImage
name: build-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux system dependencies (Tauri v2 + node-pty build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            python3 \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tooling
        run: npm ci

      - name: Prepare offline runtime (Node + @deepseek-ai/dsh)
        run: node scripts/prepare-runtime.mjs --target ${{ matrix.target }}

      - name: Build desktop app
        env:
          # FUSE is unavailable on CI runners: extract linuxdeploy instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Smoke-test the packaged runtime (process-level acceptance)
        run: node scripts/smoke-test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: src-tauri/target/release/bundle/**

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*
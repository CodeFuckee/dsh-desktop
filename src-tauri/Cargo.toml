[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop wrapper (Tauri) for Windows, Linux and macOS"
edition = "2021"

[lib]
name = "dsh_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
